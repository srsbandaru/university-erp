{% extends "base_master.html" %}
{% load django_bootstrap5 %}
{% load static %}
{% block content %}
  <div class="container mt-4">
    <div class="row">
        <div class="col">
            <div class="text-center">
                <h1>Welcome to University</h1>
                <img src="{% static 'info/img/University-Logo.png' %}" alt="University-Logo" width="400">
                <p>University Enterprise Resource Planning System</p>
            </div>
        </div>
        <div class="col">
            <div class="row">
                <div class="col-6">
                    <h3 class="text-secondary text-center">Add Teacher</h3>
                    <img src="{% static 'info/img/teacher.png' %}" class="img-thumbnail" alt="teacher">
                </div>
                <div class="col-6">
                    <h3 class="text-secondary text-center">Add Student</h3>
                    <a href="{% url 'info:CreateStudent' %}">
                        <img src="{% static 'info/img/student.png' %}" class="img-thumbnail" alt="student">
                    </a>
                </div>
                <div class="col-6">
                    <h3 class="text-secondary text-center">Add Admin</h3>
                    <img src="{% static 'info/img/admin.png' %}" class="img-thumbnail" alt="admin"> 
                </div>
                <div class="col-6">
                    <h3 class="text-secondary text-center">Manage Data</h3>
                    <a href="{% url 'info:ManageData' %}"><img src="{% static 'info/img/univ_data.png' %}" class="img-thumbnail" alt="university data"></a> 
                </div>
            </div>
        </div>
    </div>
  </div>
{% endblock content %}
