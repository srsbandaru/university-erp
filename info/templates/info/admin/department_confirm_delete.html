{% extends "base_master.html" %}
{% block title %}
    Department Confirm Delete
{% endblock title %}
{% block content %}
    <div class="container">
        <h1>Delete Department</h1>
        <hr>
        <p>Are you sure you want to delete this <span class="text-danger">"{{department.name}}"</span>?</p>
        <table class="table table-danger">
            <tr>
                <th>ID</th>
                <th>Name</th>
            </tr>
            <tr>
                <td>{{department.id}}</td>
                <td>{{department.name}}</td>
            </tr>
        </table>
        <form action="" method="post">
            {% csrf_token %}
            <button class="btn btn-danger" type="submit" value="delete">Delete</button>
            <button class="btn btn-primary" >Cancel</button>
        </form>
        
    </div>
    
{% endblock content %}
