{% extends "base_master.html" %}
{% load django_bootstrap5 %}
{% load static %}
{% block content %}
  <div class="container mt-4">
    <div class="row">
        <div class="col">
            <div class="text-center">
                <h1>Welcome {{request.user}}</h1>
                <img src="{% static 'info/img/University-Logo.png' %}" alt="University-Logo" width="400">
                <p>University Enterprise Resource Planning System</p>
            </div>
        </div>
        <div class="col">
            <div class="row">
                <div class="col-6">
                    <h3 class="text-secondary text-center">Attendance</h3>
                    <img src="{% static 'info/img/attendance.png' %}" class="img-thumbnail" alt="attendance">
                </div>
                <div class="col-6">
                    <h3 class="text-secondary text-center">Marks</h3>
                    <img src="{% static 'info/img/marks.png' %}" class="img-thumbnail" alt="marks">
                </div>
                <div class="col-6">
                    <h3 class="text-secondary text-center">Timetable</h3>
                    <img src="{% static 'info/img/timetable.png' %}" class="img-thumbnail" alt="timetable"> 
                </div>
                <div class="col-6">
                    
                </div>
            </div>
        </div>
    </div>
  </div>
{% endblock content %}
